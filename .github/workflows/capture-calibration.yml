name: Passive capture throughput calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Private bounded workspace
        run: |
          umask 077
          root="$RUNNER_TEMP/capture-calibration"
          mkdir -m 700 "$root" "$root/evidence" "$root/public"
          echo "CAPTURE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Build native capture and offline checker
        run: |
          cc -O2 -Wall -Wextra -Werror test/macos/passive_capture.c -lpcap -o "$CAPTURE_ROOT/passive-capture" > "$CAPTURE_ROOT/evidence/build.log" 2>&1
          cc -O2 -Wall -Wextra -Werror test/macos/calibration_audit.c -lpcap -o "$CAPTURE_ROOT/calibration-audit" >> "$CAPTURE_ROOT/evidence/build.log" 2>&1
      - name: Ordinary TCP transfer with passive capture
        run: |
          # Redirects intentionally open in the runner-owned private workspace.
          # shellcheck disable=SC2024
          sudo python3 -B test/macos/capture_calibration.py run "$CAPTURE_ROOT" > "$CAPTURE_ROOT/evidence/run.log" 2>&1
      - name: Retain authenticated ciphertext before offline analysis
        if: always()
        run: |
          # shellcheck disable=SC2024
          sudo python3 -B test/macos/capture_calibration.py retention-preflight "$CAPTURE_ROOT" > "$CAPTURE_ROOT/budget.log" 2>&1
          crypto="$(brew --prefix openssl@3)/bin/openssl"
          # shellcheck disable=SC2024
          sudo env CAPTURE_OPENSSL="$crypto" bash test/macos/encrypt_capture.sh "$CAPTURE_ROOT/private-traffic.pcap" "$CAPTURE_ROOT/public" test/macos/capture-recipient.pem "$CAPTURE_ROOT/evidence" > "$CAPTURE_ROOT/crypto.log" 2>&1
          printf 'complete\n' > "$CAPTURE_ROOT/encryption-success"
      - name: Bounded independent offline coverage check
        if: always()
        run: |
          # shellcheck disable=SC2024
          sudo python3 - "$CAPTURE_ROOT" > "$CAPTURE_ROOT/audit-driver.log" 2>&1 <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          if not (root / 'public/capture.tar.gz.cms').is_file():
              raise SystemExit(1)
          with (root / 'evidence/audit.json').open('xb') as out, (root / 'audit.log').open('xb') as err:
              result = subprocess.run([str(root / 'calibration-audit'), str(root / 'private-traffic.pcap'),
                                       '28464', '19000000000', '8'], stdout=out, stderr=err, timeout=180)
          raise SystemExit(result.returncode)
          PY
      - name: Publish numeric allowlist only
        if: always()
        run: |
          # shellcheck disable=SC2024
          sudo python3 -B test/macos/capture_calibration.py publish "$CAPTURE_ROOT" "$CAPTURE_ROOT/public" > "$CAPTURE_ROOT/publish.log" 2>&1
      - name: Make only public artifacts readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$CAPTURE_ROOT/public"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capture-calibration-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_ROOT }}/public
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
