name: B2
# Runs the engine's real-backend test against the B2 test bucket. By hand
# only (#613). The test works under a prefix of its own and deletes every
# object version it made by ID.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b2
  cancel-in-progress: false
jobs:
  b2:
    name: B2 real-backend test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.3'
      - run: go test -race -count=1 -v -run '^TestRealBackend$' ./internal/engine
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
