name: check
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      gate:
        description: Run the release gate tests
        type: boolean
        default: false
      chaos_seed:
        description: Replay the chaos tests with this seed
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ inputs.gate && 300 || 60 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.3'
      - id: check
        run: scripts/check.sh ${{ inputs.gate && '--gate' || '' }}
        env:
          S3_SMB_TEST_LOGS: ${{ runner.temp }}/s3-smb-logs
          S3_SMB_CHAOS_SEED: ${{ inputs.chaos_seed }}
      - if: always()
        name: Save namespace measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: namespace-measurement
          path: ${{ runner.temp }}/s3-smb-logs/namespace-measurement.json
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-logs
          path: ${{ runner.temp }}/s3-smb-logs
          retention-days: 7
      - if: failure() && steps.check.outputs.fuzz_failed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-corpus
          path: '**/testdata/fuzz/**'
          retention-days: 7
