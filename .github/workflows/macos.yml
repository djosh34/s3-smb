name: Final hosted Mac acceptance
# Normal full backup first; recovery runs on a genuinely fresh hosted Mac.
on:
  workflow_dispatch:
    inputs:
      public_version:
        description: Previously qualified released application (independent of harness SHA)
        required: true
        default: v0.1.0-rc.6
        type: string
      scenario:
        description: Labelled password control is not named-empty Time Machine acceptance
        required: true
        default: password-control
        type: choice
        options:
          - password-control
          - named-empty
permissions:
  contents: read
concurrency:
  group: final-hosted-mac
  cancel-in-progress: false
jobs:
  backup:
    name: ${{ inputs.scenario }} / full backup
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      PUBLIC_VERSION: ${{ inputs.public_version }}
      MAC_PHASE: backup
      MAC_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Set task paths
        run: |
          {
            echo "MAC_ARTIFACTS=$RUNNER_TEMP/s3-smb-mac-evidence"
            echo "MAC_WORK=$RUNNER_TEMP/s3-smb-mac-work"
            echo "MAC_TRANSFER=$RUNNER_TEMP/s3-smb-mac-transfer"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Full normal backup with durable safe progress
        uses: ./test/macos/progress-action
      - name: Preserve independent created-tree reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ inputs.scenario }}-reference-${{ github.run_attempt }}
          path: ${{ env.MAC_TRANSFER }}/reference
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
      - name: Transfer complete stopped MinIO store (no daemon-local state)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ inputs.scenario }}-store-${{ github.run_attempt }}
          path: ${{ env.MAC_TRANSFER }}/store
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          include-hidden-files: true
      - name: Verify evidence as uploader
        if: always()
        run: python3 test/macos/artifacts.py verify "$MAC_ARTIFACTS"
      - name: Retain backup evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ inputs.scenario }}-backup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.MAC_ARTIFACTS }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
  recover:
    name: ${{ inputs.scenario }} / fresh-Mac recovery
    needs: backup
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      PUBLIC_VERSION: ${{ inputs.public_version }}
      MAC_PHASE: recover
      MAC_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Set task paths
        run: |
          {
            echo "MAC_ARTIFACTS=$RUNNER_TEMP/s3-smb-mac-evidence"
            echo "MAC_WORK=$RUNNER_TEMP/s3-smb-mac-work"
            echo "MAC_TRANSFER=$RUNNER_TEMP/s3-smb-mac-transfer"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac-${{ inputs.scenario }}-reference-${{ github.run_attempt }}
          path: ${{ env.MAC_TRANSFER }}/reference
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac-${{ inputs.scenario }}-store-${{ github.run_attempt }}
          path: ${{ env.MAC_TRANSFER }}/store
      - name: Fresh-install recovery and restore with durable safe progress
        uses: ./test/macos/progress-action
      - name: Verify evidence as uploader
        if: always()
        run: python3 test/macos/artifacts.py verify "$MAC_ARTIFACTS"
      - name: Retain recovery evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ inputs.scenario }}-recover-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.MAC_ARTIFACTS }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
