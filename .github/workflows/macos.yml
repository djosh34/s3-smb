name: Apple Time Machine capability control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-time-machine:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set isolated paths
        run: |
          {
            echo "MAC_WORK=$RUNNER_TEMP/apple-tm-work"
            echo "MAC_ARTIFACTS=$RUNNER_TEMP/apple-tm-work/private"
            echo "APPLE_PUBLIC=$RUNNER_TEMP/apple-tm-public"
          } >> "$GITHUB_ENV"
      - name: Ordinary first Time Machine backup to Apple smbd
        run: bash test/macos/run_apple_tm.sh
      - name: Make only publication directory readable
        if: always()
        run: |
          if [[ -d "$APPLE_PUBLIC" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$APPLE_PUBLIC"
          fi
      - name: Retain safe metadata and authenticated ciphertext only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-tm-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.APPLE_PUBLIC }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
