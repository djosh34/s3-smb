name: Independent Apple SMB framing control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-smb-control:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apple smbd sustained WRITE control
        run: |
          sudo -n env "PATH=$PATH" \
            "CONTROL_WORK=$RUNNER_TEMP/s3-smb-client-control" \
            "CONTROL_ARTIFACTS=$RUNNER_TEMP/s3-smb-client-artifacts" \
            "ImageOS=${ImageOS:-unknown}" "ImageVersion=${ImageVersion:-unknown}" \
            PYTHONDONTWRITEBYTECODE=1 \
            bash test/macos/smb_control.sh
      - name: Make sanitized artifacts readable
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/s3-smb-client-artifacts" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/s3-smb-client-artifacts"
          fi
      - name: Upload sanitized framing audit only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-smb-control-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s3-smb-client-artifacts
          if-no-files-found: error
          retention-days: 14
