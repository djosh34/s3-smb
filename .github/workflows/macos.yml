name: Time Machine framing diagnostic
# Branch-only diagnostic: exactly one Mac job per dispatch, no transfer/recovery.
on:
  workflow_dispatch:
    inputs:
      binary:
        description: Unmodified public rc.7 or rc.7 with transport-only observations
        type: choice
        required: true
        default: baseline
        options: [baseline, instrumented]
permissions:
  contents: read
jobs:
  diagnostic:
    name: rc7-${{ inputs.binary }}
    runs-on: macos-15-intel
    timeout-minutes: 65
    env:
      PUBLIC_VERSION: v0.1.0-rc.7
      MAC_PHASE: diagnostic
      DIAGNOSTIC_BINARY: ${{ inputs.binary }}
    steps:
      - name: Set task paths
        run: |
          {
            echo "MAC_ARTIFACTS=$RUNNER_TEMP/s3-smb-mac-evidence"
            echo "MAC_WORK=$RUNNER_TEMP/s3-smb-mac-work"
            echo "MAC_TRANSFER=$RUNNER_TEMP/s3-smb-mac-transfer"
            echo "MAC_PUBLIC=$RUNNER_TEMP/s3-smb-public-metadata"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Real Time Machine backup with full scratch capture
        run: bash test/macos/run.sh
      - name: Export explicit public metadata allowlist
        if: always()
        run: |
          sudo python3 test/macos/publish_diagnostic.py "$MAC_ARTIFACTS" "$MAC_PUBLIC"
          sudo chown -R "$(id -u):$(id -g)" "$MAC_PUBLIC"
          chmod -R u+rwX "$MAC_PUBLIC"
      - name: Retain authenticated encrypted capture and private logs
        if: always() && inputs.binary == 'instrumented'
        run: |
          if sudo test -f "$MAC_WORK/private-traffic.pcap"; then
            crypto="$(brew --prefix openssl@3)/bin/openssl"
            sudo env "CAPTURE_OPENSSL=$crypto" bash test/macos/encrypt_capture.sh \
              "$MAC_WORK/private-traffic.pcap" "$MAC_PUBLIC" test/macos/capture-recipient.pem "$MAC_ARTIFACTS"
            sudo chown -R "$(id -u):$(id -g)" "$MAC_PUBLIC"
          fi
      - name: Upload metadata and ciphertext only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-framing-${{ inputs.binary }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.MAC_PUBLIC }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
