name: Independent Apple SMB workload control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-smb-control:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apple smbd only, bounded sustained WRITE control
        run: |
          sudo -n env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 \
            python3 test/macos/smb_control.py \
            --work "$RUNNER_TEMP/apple-control-private" \
            --public "$RUNNER_TEMP/apple-control-public"
      - name: Make only public metadata readable
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/apple-control-public" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apple-control-public"
          fi
      - name: Upload metadata only, never private scratch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-control-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-control-public
          if-no-files-found: error
          retention-days: 14
